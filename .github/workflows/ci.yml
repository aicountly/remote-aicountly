# ---------------------------------------------------------------------------
# Continuous integration for AICOUNTLY Remote.
#
# Runs on every pull request and every push to main, and on demand. It does NOT
# deploy — deployment stays manual, through the two workflow_dispatch workflows,
# and each of them calls this workflow first (workflow_call) so a red suite
# blocks the deploy.
#
# Three independent jobs so a frontend type error does not hide a backend test
# failure, and so the slowest job (the backend, which needs a real PostgreSQL)
# does not gate the two fast ones.
# ---------------------------------------------------------------------------
name: CI

on:
  # push / pull_request removed: run on demand (or via workflow_call from a deploy); test locally before merging to save Actions minutes.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# event_name keeps a run called from a deploy out of the group a push to the same
# branch uses, so neither cancels the other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (CodeIgniter + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL, not SQLite. The schema uses JSONB, INET, partial
    # unique indexes, CHECK constraints and ON CONFLICT — testing against
    # anything else would test a different database than production runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aicountly_remote
          POSTGRES_PASSWORD: remote_ci
          POSTGRES_DB: aicountly_remote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicountly_remote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pgsql, curl, json
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress

      - name: Check for known vulnerabilities
        working-directory: backend
        run: composer audit

      # A throwaway coturn (REST auth, UDP/TCP 3478, TLS 5349 with a one-day self-signed certificate)
      # so the ICE kit's live tests allocate real relays with credentials the kit minted, instead of
      # being skipped. Nothing here reaches the production relays.
      - name: Local coturn for the ICE kit's live tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq coturn >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/turn-key.pem -out /tmp/turn-cert.pem -days 1 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost" -addext "basicConstraints=critical,CA:TRUE" 2>/dev/null
          sudo turnserver -o --listening-ip=127.0.0.1 --relay-ip=127.0.0.1 --listening-port=3478 --tls-listening-port=5349 \
            --realm=ci.aicountly.test --use-auth-secret --static-auth-secret=ci-coturn-secret \
            --cert=/tmp/turn-cert.pem --pkey=/tmp/turn-key.pem --no-cli --allow-loopback-peers --min-port=40000 --max-port=40100
          sleep 2

      - name: Run tests
        working-directory: backend
        env:
          ICE_KIT_TEST_TURN_HOST: localhost
          ICE_KIT_TEST_TURN_SECRET: ci-coturn-secret
          ICE_KIT_TEST_TURN_CA: /tmp/turn-cert.pem
          # The suite runs against the `tests` connection group.
          database.tests.hostname: 127.0.0.1
          database.tests.database: aicountly_remote_test
          database.tests.username: aicountly_remote
          database.tests.password: remote_ci
          database.tests.DBDriver: Postgre
          database.tests.port: '5432'
        run: vendor/bin/phpunit --no-coverage

      - name: Verify migrations roll back cleanly
        working-directory: backend
        env:
          CI_ENVIRONMENT: development
          database.default.hostname: 127.0.0.1
          database.default.database: aicountly_remote_test
          database.default.username: aicountly_remote
          database.default.password: remote_ci
          database.default.DBDriver: Postgre
          database.default.port: '5432'
        run: |
          # A migration that cannot be undone is a migration nobody can deploy
          # with confidence, so the rollback is exercised, not assumed.
          php spark migrate
          php spark migrate:rollback
          php spark migrate

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  signalling:
    name: Signalling service (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signalling/package-lock.json

      - name: Install dependencies
        working-directory: signalling
        run: npm ci

      - name: Test
        working-directory: signalling
        run: npm test
