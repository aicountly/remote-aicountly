# ---------------------------------------------------------------------------
# Continuous integration for AICOUNTLY Remote.
#
# Runs on every push and pull request. It does NOT deploy — deployment stays
# manual, through the two workflow_dispatch workflows.
#
# Three independent jobs so a frontend type error does not hide a backend test
# failure, and so the slowest job (the backend, which needs a real PostgreSQL)
# does not gate the two fast ones.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (CodeIgniter + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL, not SQLite. The schema uses JSONB, INET, partial
    # unique indexes, CHECK constraints and ON CONFLICT — testing against
    # anything else would test a different database than production runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aicountly_remote
          POSTGRES_PASSWORD: remote_ci
          POSTGRES_DB: aicountly_remote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicountly_remote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pgsql, curl, json
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --no-progress

      - name: Check for known vulnerabilities
        working-directory: backend
        run: composer audit

      - name: Run tests
        working-directory: backend
        env:
          # The suite runs against the `tests` connection group.
          database.tests.hostname: 127.0.0.1
          database.tests.database: aicountly_remote_test
          database.tests.username: aicountly_remote
          database.tests.password: remote_ci
          database.tests.DBDriver: Postgre
          database.tests.port: '5432'
        run: vendor/bin/phpunit --no-coverage

      - name: Verify migrations roll back cleanly
        working-directory: backend
        env:
          CI_ENVIRONMENT: development
          database.default.hostname: 127.0.0.1
          database.default.database: aicountly_remote_test
          database.default.username: aicountly_remote
          database.default.password: remote_ci
          database.default.DBDriver: Postgre
          database.default.port: '5432'
        run: |
          # A migration that cannot be undone is a migration nobody can deploy
          # with confidence, so the rollback is exercised, not assumed.
          php spark migrate
          php spark migrate:rollback
          php spark migrate

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  signalling:
    name: Signalling service (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: signalling/package-lock.json

      - name: Install dependencies
        working-directory: signalling
        run: npm ci

      - name: Test
        working-directory: signalling
        run: npm test
