# ---------------------------------------------------------------------------
# Continuous integration for the AICOUNTLY Remote desktop agent.
#
# Separate from ci.yml because it has different runners, a different cache and
# a much longer cold build: putting it in the same file would make every
# backend change wait for a Windows runner.
#
# It does NOT deploy, publish or sign anything. Releases are release-windows.yml,
# manually, with a protected environment — and that workflow calls this one first
# (workflow_call), so a release cannot be built from a commit whose checks are red.
#
# Path-filtered, so a change to web/ or backend/ does not spend a Windows
# runner. The workflow file itself is in the filter — a change to how the agent
# is built has to be exercised by the change that makes it.
# ---------------------------------------------------------------------------
name: Desktop CI

# Manual only since 2026-10-08 (this replaces any "runs on every pull request / push"
# wording above): no push or pull_request trigger, to save GitHub Actions minutes. Run
# the same suite locally before merging, or here from the Actions tab (workflow_dispatch);
# a deploy runs it first when its run_ci_gate box is ticked (workflow_call).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per caller. In a called workflow `github.workflow` is the *caller's*
# name, so release-windows.yml and release-macos.yml each verify in a group of
# their own and can run side by side. Keyed on event and ref alone, both
# releases of a version (workflow_dispatch on main) shared one group, and
# whichever started second cancelled the other's checks (1.0.1 beta, Windows).
# A run started here directly is grouped as "Desktop CI" and still replaces an
# earlier direct run on the same ref.
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A remote-control agent is not a place to discover that a warning became a
  # compile error in a later release, or to let one through because nobody read
  # the log.
  RUSTFLAGS: '-D warnings'

jobs:
  # -------------------------------------------------------------------------
  # The portable crates. Everything that is not a native call lives in
  # `desktop/crates/`, so the great majority of the agent's logic — the wire
  # protocol, the control gate, the device identity, the state machine — is
  # tested here, on a fast runner, on every push.
  # -------------------------------------------------------------------------
  rust:
    name: Rust (portable crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop

      - name: Formatting
        working-directory: desktop
        run: cargo fmt --all -- --check

      # webkit2gtk and friends are what `tauri` links against on Linux. The
      # shipped product is Windows; building the Tauri crate here is how the
      # non-Windows half of the platform layer stays compiling.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace

  # -------------------------------------------------------------------------
  # The Windows half.
  #
  # `cargo check` for the Windows target, not a full bundle: this job's purpose
  # is that `src-tauri/src/platform/windows/` and `agents/windows-service/`
  # compile, which is exactly what a Linux-only CI cannot tell you. The
  # installer is built in the release workflow.
  # -------------------------------------------------------------------------
  windows:
    name: Rust (Windows target)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop

      # The installer build below runs `npm ci` and the Tauri CLI.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The service is built first because Tauri's build script resolves the
      # sidecar at compile time on Windows: without the file, the application
      # crate does not even configure. Building it first is also the order the
      # release script uses, so the two cannot disagree.
      - name: Build the service
        working-directory: desktop
        run: cargo build -p aicountly-remote-service

      - name: Stage the service as a sidecar
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/debug/AicountlyRemoteService.exe `
            src-tauri/binaries/AicountlyRemoteService-x86_64-pc-windows-msvc.exe -Force

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace

      # The installer, built unsigned and thrown away.
      #
      # Nothing used to build it outside a release, and `installers/windows/
      # hooks.nsh` is a text file no compiler reads — so a hook that named a
      # file which is never built, or an NSIS script that does not even
      # assemble, could only be discovered by running a release and
      # installing the result. `src-tauri/tests/installer.rs` checks what the
      # hooks say; this checks that the installer builds at all, with the
      # hooks in it.
      #
      # Unsigned deliberately: this job holds no credential, and a signed
      # build is the release workflow's job.
      - name: Build the installer
        shell: pwsh
        working-directory: desktop
        run: |
          pwsh -File scripts/windows/build.ps1 -Configuration release -Target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'The installer did not build.' }

          $installers = Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue
          if (-not $installers) { throw 'The build produced no installer.' }

          $installers | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

  # -------------------------------------------------------------------------
  # The macOS half: the control companion.
  #
  # `src-tauri/src/platform/macos/` keeps its CGEvent, Keychain, display and
  # Accessibility calls in `#[cfg(target_os = "macos")] mod imp` blocks, which
  # no Linux job compiles. This one does — clippy with warnings as errors, and
  # the whole workspace's tests on a Mac — so the FFI is checked by a compiler
  # before a test build reaches anybody's machine. No bundle, no signing: that
  # is build-macos-test.yml.
  # -------------------------------------------------------------------------
  macos:
    name: Rust (macOS target)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop

      - name: Clippy
        working-directory: desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: desktop
        run: cargo test --workspace

  # -------------------------------------------------------------------------
  # The agent's own interface. Same React/TypeScript checks the web client
  # gets, because it is the same kind of code and has the same ways to break.
  # -------------------------------------------------------------------------
  frontend:
    name: Desktop interface (React + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check
        working-directory: desktop
        run: npm run typecheck

      - name: Test
        working-directory: desktop
        run: npm test

      # The build scripts, which vitest does not see: it is configured for the
      # window's sources, and these run under node with no DOM at all. One of
      # them decides what the website is told about a release, so it is not
      # somewhere to find out later.
      - name: Test the build scripts
        working-directory: desktop
        run: npm run test:scripts

      - name: Build
        working-directory: desktop
        run: npm run build

  # -------------------------------------------------------------------------
  # Dependency advisories.
  #
  # Its own job and not allowed to fail silently: an agent that runs as
  # LocalSystem on a customer's machine and injects input into their desktop is
  # not somewhere to carry a known-vulnerable dependency because a build was
  # green.
  # -------------------------------------------------------------------------
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust advisories
        working-directory: desktop
        run: cargo audit --deny warnings

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm advisories
        working-directory: desktop
        run: npm audit --audit-level=high
