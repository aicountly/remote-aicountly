# ---------------------------------------------------------------------------
# Release AICOUNTLY Remote for Windows.
#
# MANUAL ONLY. The single trigger is workflow_dispatch — merging or pushing
# never releases. Add no push/pull_request/schedule triggers to this file.
#
# It publishes nothing to the cPanel hosts. The two deploy-*.yml workflows own
# that, they are untouched by this, and a desktop release does not go near the
# web deployment.
#
# What it produces
# ----------------
#   sandbox     an UNSIGNED development build, kept as a workflow artifact for
#               seven days. Clearly labelled. Never a GitHub release.
#   beta        a signed build, published as a GitHub pre-release.
#   production  a signed build, published as a GitHub release.
#
# beta and production require the `windows-release` GitHub Environment, which
# is where the signing credentials live and where required reviewers are
# configured. A job that cannot reach that environment cannot sign, which is
# the point: the protection is GitHub's, not a check inside a script.
#
# NSIS only, deliberately. tauri.conf.json used to also build an MSI, but
# installers/windows/hooks.nsh — the service registration, the data
# directory's ACLs, the Run key, and the uninstall cleanup that removes the
# device key and config — is NSIS-specific; WiX has no equivalent wired up.
# An MSI built from the same config installed the binaries and nothing else:
# no service, no cleanup on uninstall. Shipping it alongside the NSIS
# installer meant two working-looking installers where only one actually
# worked, which is how somebody ends up with two Control Panel entries and a
# machine an uninstall never actually cleaned up.
#
# What this workflow will not do
# ------------------------------
#   * It will not sign with a self-signed certificate. `sign.ps1` refuses one.
#   * It will not describe an unsigned artifact as a release. The sandbox
#     channel cannot create a GitHub release at all.
#   * It will not enable the auto-updater. There is no updater in the build:
#     `tauri-plugin-updater` was removed because it was the only thing
#     pulling in a crate carrying a critical advisory, for a feature that was
#     switched off — see docs/desktop/WINDOWS_RELEASE.md. The updater-signing
#     keys that would be needed to bring it back are a different thing from
#     the Authenticode certificate and are not interchangeable with it.
# ---------------------------------------------------------------------------
name: Release AICOUNTLY Remote for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0. Must match desktop/Cargo.toml.'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        default: sandbox
        options:
          - sandbox
          - beta
          - production

concurrency:
  group: release-windows-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate: the full test-and-lint suite runs first, on this exact commit, by calling
  # desktop-ci.yml as a reusable workflow. The deploy job `needs:` it, so a red suite
  # blocks the deploy. The suite only tests and lints; it never deploys or reaches a live host.
  verify:
    name: Verify (Desktop CI)
    uses: ./.github/workflows/desktop-ci.yml

  build:
    needs: verify
    name: Build ${{ inputs.version }} (${{ inputs.channel }})
    runs-on: windows-latest
    timeout-minutes: 60

    # sandbox builds nothing that needs a secret, so it needs no environment
    # and no reviewer. beta and production get the protected one.
    environment: ${{ inputs.channel == 'sandbox' && '' || 'windows-release' }}

    permissions:
      contents: write

    outputs:
      signed: ${{ steps.build.outputs.signed }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The version is one authoritative value in desktop/Cargo.toml, and the
      # input has to match it. Without this a release could be tagged 1.2.0 and
      # contain a binary reporting 1.1.0, which is the kind of thing nobody
      # notices until a support call.
      - name: Check the version matches the workspace
        shell: pwsh
        # The free-text input reaches the script through the environment, never
        # interpolated into it: a version such as 1.0.0'; <command> would
        # otherwise run inside a job holding contents: write.
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REQUESTED_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw 'The version input must look like 1.2.3 or 1.2.3-beta.1.'
          }
          $cargo = Get-Content desktop/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw 'The workspace version could not be read from desktop/Cargo.toml.'
          }
          $workspace = $Matches[1]

          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json

          Write-Host "workspace: $workspace"
          Write-Host "tauri.conf.json: $($conf.version)"
          Write-Host "package.json: $($package.version)"
          Write-Host "requested: $env:REQUESTED_VERSION"

          if ($workspace -ne $env:REQUESTED_VERSION) {
            throw "desktop/Cargo.toml is $workspace but this run asked for $env:REQUESTED_VERSION."
          }
          if ($conf.version -ne $workspace) { throw 'tauri.conf.json disagrees with the workspace version.' }
          if ($package.version -ne $workspace) { throw 'package.json disagrees with the workspace version.' }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check that a signing method is configured
        if: inputs.channel != 'sandbox'
        shell: pwsh
        env:
          AICOUNTLY_SIGN_METHOD: ${{ vars.AICOUNTLY_SIGN_METHOD }}
        run: |
          if (-not $env:AICOUNTLY_SIGN_METHOD) {
            $missingSigningMessage = @(
              'This channel publishes a signed build, and no signing method is configured.',
              '',
              'Set the variable AICOUNTLY_SIGN_METHOD (and its companions) on the',
              'windows-release environment. See docs/desktop/WINDOWS_RELEASE.md.'
            ) -join "`n"
            throw $missingSigningMessage
          }

      # ---------------------------------------------------------------- signing
      #
      # The signing client is installed BEFORE the build, because the build is
      # where signing now happens: `build.ps1 -Sign` hands sign.ps1 to the
      # Tauri bundler as its signing command, so the application binary, the
      # service sidecar, the NSIS plugins, the uninstaller and the installer
      # are each signed as they are produced.
      #
      # This replaces a separate Sign step that ran after the build. That step
      # signed the installer and the two loose executables in the target
      # directory — but the copies *inside* the installer had already been
      # packaged, unsigned, and were the ones a customer actually ran. The
      # verification afterwards passed, because the file it checked was the
      # installer.
      #
      # Every credential comes from the protected environment. None of them has
      # a default, none is a workflow input, and none is ever written to the
      # workspace — so a sandbox run, or a fork, simply has nothing to sign
      # with and says so.
      - name: Install the Trusted Signing client
        if: inputs.channel != 'sandbox' && vars.AICOUNTLY_SIGN_METHOD == 'trusted-signing'
        shell: pwsh
        # The script, not forty lines of PowerShell in a YAML string: the
        # signing smoke test runs the same code, and a script can be read and
        # changed. It searches for Azure.CodeSigning.Dlib.dll rather than
        # assuming where the module keeps it, which is what broke a release
        # that had already passed the whole gate, and it exports
        # AICOUNTLY_SIGN_DLIB for sign.ps1.
        run: pwsh -NoProfile -NonInteractive -File desktop/scripts/windows/install-signing-client.ps1

      # The same script a developer runs, so a release build and a local build
      # are the same build — with `-Sign` added for a channel that publishes.
      - name: Build
        id: build
        shell: pwsh
        working-directory: desktop
        env:
          AICOUNTLY_SIGN_METHOD: ${{ vars.AICOUNTLY_SIGN_METHOD }}
          AICOUNTLY_SIGN_TIMESTAMP_URL: ${{ vars.AICOUNTLY_SIGN_TIMESTAMP_URL }}
          AICOUNTLY_SIGN_ENDPOINT: ${{ vars.AICOUNTLY_SIGN_ENDPOINT }}
          AICOUNTLY_SIGN_ACCOUNT: ${{ vars.AICOUNTLY_SIGN_ACCOUNT }}
          AICOUNTLY_SIGN_PROFILE: ${{ vars.AICOUNTLY_SIGN_PROFILE }}
          AICOUNTLY_SIGN_THUMBPRINT: ${{ secrets.AICOUNTLY_SIGN_THUMBPRINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $arguments = @(
            '-File', 'scripts/windows/build.ps1',
            '-Configuration', 'release',
            '-Target', 'x86_64-pc-windows-msvc'
          )

          if ($env:INPUT_CHANNEL -ne 'sandbox') { $arguments += '-Sign' }

          pwsh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'The build failed.' }

          $signed = if ($env:INPUT_CHANNEL -eq 'sandbox') { 'false' } else { 'true' }
          "signed=$signed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Verified on exactly the files that are about to be uploaded, and on the
      # two executables that go inside them — which is the check that was
      # missing. A signature that did not take, or took without a timestamp, is
      # something a release process should catch rather than a customer.
      - name: Verify signatures
        shell: pwsh
        working-directory: desktop
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $target = 'target/x86_64-pc-windows-msvc/release'
          $allowUnsigned = $env:INPUT_CHANNEL -eq 'sandbox'

          # '&' runs the script in THIS PowerShell session rather than
          # spawning a nested pwsh.exe. That distinction matters here: an
          # external process only receives a flat argv array, so PowerShell
          # would have to serialise the comma-separated -Path list into
          # separate command-line tokens, and the script's own parameter
          # binder would only pick up the first one.
          & 'scripts/windows/verify.ps1' -Path `
            "$target/bundle/nsis/*.exe", `
            "$target/AicountlyRemote.exe", `
            "src-tauri/binaries/AicountlyRemoteService-x86_64-pc-windows-msvc.exe" `
            -AllowUnsigned:$allowUnsigned

          if ($LASTEXITCODE -ne 0) { throw 'The artifacts are not fit to publish.' }

      - name: Collect artifacts
        shell: pwsh
        working-directory: desktop
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $target = 'target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Get-ChildItem "$target/bundle/nsis/*.exe" | Copy-Item -Destination release

          # Checksums, so somebody who downloaded an installer from anywhere
          # can tell whether it is the one this run produced.
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding utf8

          Get-Content release/SHA256SUMS.txt

          if ($env:INPUT_CHANNEL -eq 'sandbox') {
            # Travels with the artifact, so an unsigned build cannot be handed
            # to somebody as though it were a release.
            $unsignedNotice = @(
              'UNSIGNED DEVELOPMENT BUILD',
              '==========================',
              '',
              "Built from ${{ github.sha }} on the sandbox channel.",
              '',
              'These installers are NOT signed. Windows SmartScreen will warn about them and',
              'that warning is correct — nothing here vouches for who produced them.',
              '',
              'Do not distribute them to customers, and do not describe them as a release.',
              'Signed builds come from the beta and production channels.'
            ) -join "`n"
            $unsignedNotice | Set-Content -Path release/UNSIGNED-DEVELOPMENT-BUILD.txt -Encoding utf8
          }

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aicountly-remote-windows-${{ inputs.version }}-${{ inputs.channel }}
          path: desktop/release/*
          # A development build is a thing somebody looked at this week, not an
          # archive. Signed builds live in the GitHub release below.
          retention-days: ${{ inputs.channel == 'sandbox' && 7 || 90 }}
          if-no-files-found: error

      # A GitHub release only for a channel that actually signs. There is no
      # branch here that could publish an unsigned artifact as a release.
      - name: Publish a GitHub release
        if: inputs.channel != 'sandbox'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: desktop-v${{ inputs.version }}${{ inputs.channel == 'beta' && '-beta' || '' }}
          name: AICOUNTLY Remote for Windows ${{ inputs.version }}
          prerelease: ${{ inputs.channel == 'beta' }}
          draft: false
          files: desktop/release/*
          body: |
            AICOUNTLY Remote for Windows ${{ inputs.version }} (${{ inputs.channel }}).

            Signed and timestamped. Verify a download against `SHA256SUMS.txt`,
            and check the signature with:

                Get-AuthenticodeSignature .\AICOUNTLY-Remote-x64-Setup.exe

            Built from ${{ github.sha }}.
