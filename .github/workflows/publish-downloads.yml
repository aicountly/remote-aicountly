# Put a signed release on downloads.aicountly.com, where the website can
# offer it.
#
# MANUAL ONLY, and separate from the build on purpose. Building an installer
# and publishing one are different decisions: `release-windows.yml` and
# `release-macos.yml` produce signed, verified builds and GitHub releases, and
# this takes those and makes them something a stranger can download. Nobody
# should be able to do the second by merging something.
#
# This follows aicountly/connect-aicountly's `desktop.yml` publish job, which
# learned two things the expensive way and whose checks are reproduced here:
#
#   * the secrets are DOWNLOAD_PROD_SSH_*, and the prefix is load-bearing.
#     These repositories also have a PROD_SSH_* set for a different cPanel
#     account, and it is set -- so an unprefixed name resolves to a real host
#     that serves none of this. That is how a release reached an account no
#     hostname points at, with every step green.
#   * ruling out the wrong root is not the same as finding the right one. A
#     root that is neither the website nor the downloads host accepts the
#     upload and serves nothing. So this looks for the landing page that
#     aicountly/aicountly-downloads deploys, which is the only evidence from
#     this side that the root is the one downloads.aicountly.com serves.
#
# The order of the remaining steps is the safety property. The website reads
# one file -- remote/manifest.json -- and puts a download button on everything
# it names. It cannot check that those files are really there, because they
# are on another host. So:
#
#   1. the installers go up, into the version's own directory,
#   2. every one of them is fetched back over HTTPS and checked against the
#      size the manifest claims,
#   3. and only then does the manifest go up,
#   4. and the manifest the host serves is checked to be the one just written.
#
# A manifest that names a file is this workflow's word that it already looked.
# Nothing here may write the manifest first, and nothing may write it at all
# if step 2 did not pass.
name: Publish AICOUNTLY Remote to downloads.aicountly.com

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, e.g. 1.0.0 (must already have a GitHub release). Ignored by check-access.
        required: false
        default: ''
        type: string
      build:
        description: >-
          Leave empty to publish the newest build of each platform. A build
          number (yyyyMMddHHmm, from a release name) publishes what was newest
          at that build instead -- which is how one build is rolled back to
          an earlier one.
        required: false
        default: ''
        type: string
      channel:
        description: Which channel's release to publish
        required: true
        default: beta
        type: choice
        options: [beta, production]
      mode:
        description: >-
          files-and-manifest publishes a release. manifest-only re-points the
          manifest at a version already on the host, which is how a rollback
          is done. check-access proves the five secrets reach the right host
          and uploads nothing.
        required: true
        default: files-and-manifest
        type: choice
        options: [files-and-manifest, manifest-only, check-access]

concurrency:
  # One publish at a time. Two at once could upload one version's files and
  # another version's manifest.
  group: downloads-publish-remote
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRODUCT: remote
  BASE_URL: https://downloads.aicountly.com

jobs:
  # Before anything is built or downloaded, because the failure this catches
  # is a secret that is missing or pasted wrong, and finding that out after a
  # 400 MB download helps nobody.
  preflight:
    name: Check the downloads host is configured
    runs-on: ubuntu-latest
    steps:
      - name: The five secrets
        # Values are never printed. Lengths are, because a secret pasted with
        # a stray newline or quote is set, wrong, and otherwise invisible.
        env:
          DOWNLOAD_PROD_SSH_HOST: ${{ secrets.DOWNLOAD_PROD_SSH_HOST }}
          DOWNLOAD_PROD_SSH_PORT: ${{ secrets.DOWNLOAD_PROD_SSH_PORT }}
          DOWNLOAD_PROD_SSH_USER: ${{ secrets.DOWNLOAD_PROD_SSH_USER }}
          DOWNLOAD_PROD_SSH_REMOTE_ROOT: ${{ secrets.DOWNLOAD_PROD_SSH_REMOTE_ROOT }}
          DOWNLOAD_PROD_SSH_PRIVATE_KEY: ${{ secrets.DOWNLOAD_PROD_SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          missing=""
          for name in DOWNLOAD_PROD_SSH_HOST DOWNLOAD_PROD_SSH_PORT DOWNLOAD_PROD_SSH_USER DOWNLOAD_PROD_SSH_REMOTE_ROOT DOWNLOAD_PROD_SSH_PRIVATE_KEY; do
            value="${!name-}"
            if [ -z "${value}" ]; then
              printf '  %-30s EMPTY\n' "${name}"
              missing="${missing} ${name}"
            elif [ "${name}" = "DOWNLOAD_PROD_SSH_PRIVATE_KEY" ]; then
              printf '  %-30s set\n' "${name}"
            else
              printf '  %-30s set (%s characters)\n' "${name}" "${#value}"
            fi
          done

          if [ -n "${missing}" ]; then
            echo "::error title=Secrets empty in this repository::Empty here:${missing}. They must be set in aicountly/remote-aicountly itself -- a secret belongs to one repository, and copies in aicountly/aicountly-downloads or aicountly/connect-aicountly are invisible to this job. If one shows EMPTY but you can see it in Settings, check WHERE it was added: an Environment secret is only visible to a job that declares that environment, and these are read as repository secrets. An Organization secret must also grant access to this repository. DOWNLOAD_PROD_SSH_REMOTE_ROOT is the document root of downloads.aicountly.com -- the same value it has in aicountly/aicountly-downloads, NOT this site's PROD_SSH_REMOTE_ROOT."
            exit 1
          fi
          echo "All five are present."

  publish:
    name: Publish ${{ inputs.version }} (${{ inputs.channel }})
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Before it is trusted with a release. It needs no dependencies, so
      # there is nothing to install first.
      - name: Test the manifest writer
        working-directory: desktop
        run: npm run test:scripts

      # The GitHub release, not a workflow artifact: a release only exists for
      # a channel that signs, which makes "is this signed?" a question already
      # answered rather than one asked here. Every build has a release of its
      # own (desktop-v<version>[-beta]-b<build>), and Windows and macOS are
      # built separately, so this takes the newest build of each platform.
      - name: Check the version was given
        if: inputs.mode != 'check-access'
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error title=No version::This mode publishes something, so it needs a version. Only check-access runs without one."
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=Not a version::'${VERSION}' does not look like 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          if [ -n "${BUILD}" ] && ! printf '%s' "${BUILD}" | grep -Eq '^[0-9]{12}$'; then
            echo "::error title=Not a build number::'${BUILD}' is not a build number. It is twelve digits, yyyyMMddHHmm, as in a release named 'AICOUNTLY Remote 1.0.0 (build 202610301030)'."
            exit 1
          fi

      - name: Fetch the signed release
        if: inputs.mode != 'check-access'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p staging work

          suffix=""
          [ "${CHANNEL}" = "beta" ] && suffix="-beta"
          base="desktop-v${VERSION}${suffix}"

          # Every build of this version on this channel, newest first -- or,
          # given a build, that one and those before it. The release from
          # before builds were numbered, if there still is one, comes last:
          # it is older than any of them.
          releases=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 \
            --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')

          candidates=()
          while IFS= read -r tag; do
            number="${tag#"${base}-b"}"
            [ "${number}" != "${tag}" ] || continue
            [[ "${number}" =~ ^[0-9]{12}$ ]] || continue
            if [ -n "${BUILD}" ] && [ "${number}" \> "${BUILD}" ]; then
              continue
            fi
            candidates+=("${tag}")
          done < <(printf '%s\n' "${releases}" | sort -r)

          if printf '%s\n' "${releases}" | grep -qxF "${base}"; then
            candidates+=("${base}")
          fi

          if [ "${#candidates[@]}" -eq 0 ]; then
            echo "There is no release of ${VERSION} on the ${CHANNEL} channel."
            echo
            echo "Releases that do exist in ${GITHUB_REPOSITORY}:"
            if [ -z "${releases}" ]; then
              echo "  (none -- this repository has never published one)"
              echo "::error title=Nothing has been released yet::This workflow publishes a release; it does not build one, and ${GITHUB_REPOSITORY} has no releases at all. Build one first with release-windows.yml (and release-macos.yml for a Mac build), using channel beta or production. Note that channel: sandbox deliberately publishes NO release -- a sandbox build is unsigned, and nothing unsigned may reach the downloads host -- so a green sandbox run leaves nothing here to publish."
              exit 1
            fi
            printf '%s\n' "${releases}" | head -20 | sed 's/^/  /'
            echo
            echo "::error title=No release of ${VERSION} (${CHANNEL})::The channel chosen here decides the tag: beta looks for ${base%-beta}-beta-b<build>, production for desktop-v<version>-b<build>. This run asked for '${CHANNEL}'${BUILD:+ at or before build ${BUILD}}. If the build was made on the other channel, re-run this with that channel selected rather than renaming anything."
            exit 1
          fi

          echo "Builds of ${VERSION} (${CHANNEL}), newest first:"
          printf '  %s\n' "${candidates[@]}"

          # The newest release that has each platform's installers, with its
          # own checksums. Their sums files are named apart
          # (SHA256SUMS.txt, SHA256SUMS-macos.txt), so the two can share a
          # directory; the notices cannot, and are named apart here.
          found=0
          take() {
            local platform="$1" extension="$2" sums="$3" tag names
            for tag in "${candidates[@]}"; do
              names=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
              if printf '%s\n' "${names}" | grep -q "\.${extension}\$"; then
                echo "${platform}: ${tag}"
                mkdir -p "work/${platform}"
                gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir "work/${platform}" \
                  --pattern "*.${extension}" --pattern "${sums}" --pattern 'UNSIGNED.txt'
                [ -f "work/${platform}/UNSIGNED.txt" ] && mv "work/${platform}/UNSIGNED.txt" "work/${platform}/UNSIGNED-${platform}.txt"
                mv "work/${platform}"/* staging/
                found=$((found + 1))
                return 0
              fi
            done
            echo "${platform}: no build of ${VERSION} has one"
          }

          take windows exe 'SHA256SUMS.txt'
          take macos dmg 'SHA256SUMS-macos.txt'

          if [ "${found}" -eq 0 ]; then
            echo "::error title=Nothing to publish::None of the releases above carries an installer or a disk image."
            exit 1
          fi
          ls -la staging

      # Block maps are for differential updates and the macOS .zip is what an
      # updater would consume; there is no updater, and uploading them would
      # put a second copy of every build on the host.
      - name: Keep only what a person downloads
        if: inputs.mode != 'check-access'
        run: rm -f staging/*.zip staging/*.blockmap

      # Renames each installer to a name that is safe in a URL and carries its
      # build, hashes it, cross-checks SHA256SUMS.txt, and writes the
      # manifest beside the workspace rather than into staging -- so the
      # upload below cannot carry it up early.
      - name: Describe the release
        if: inputs.mode != 'check-access'
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          node desktop/scripts/make-manifest.mjs \
            --dir staging \
            --product "${PRODUCT}" \
            --version "${VERSION}" \
            --channel "${CHANNEL}" \
            --out manifest.json
          cat manifest.json

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOWNLOAD_PROD_SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        env:
          SSH_HOST: ${{ secrets.DOWNLOAD_PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.DOWNLOAD_PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "::warning::ssh-keyscan failed; rsync will use StrictHostKeyChecking=accept-new"

      - name: Check REMOTE_ROOT is the downloads host, not the website
        # Connect's publish ran twice into the wrong cPanel account before
        # this check existed: rsync did exactly what it was asked, reported
        # success, and nothing could fetch the result. Ruling out the website
        # cannot catch a root that is neither -- so look for the landing page
        # aicountly/aicountly-downloads deploys. Nothing else has it.
        env:
          SSH_HOST: ${{ secrets.DOWNLOAD_PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.DOWNLOAD_PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.DOWNLOAD_PROD_SSH_USER }}
          REMOTE_ROOT: ${{ secrets.DOWNLOAD_PROD_SSH_REMOTE_ROOT }}
        run: |
          set -euo pipefail
          if ! ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
                 "${SSH_USER}@${SSH_HOST}" \
                 "grep -q 'Aicountly downloads' '${REMOTE_ROOT}/index.html' 2>/dev/null"; then
            echo "::error title=Not the downloads document root::DOWNLOAD_PROD_SSH_REMOTE_ROOT does not hold the downloads host's landing page, so this is not the root downloads.aicountly.com serves -- uploading here would put hundreds of megabytes where nothing can fetch it. It must be the same value DOWNLOAD_PROD_SSH_REMOTE_ROOT has in aicountly/aicountly-downloads, whose deploy put that page there. If that deploy has never run, run it first."
            exit 1
          fi
          echo "REMOTE_ROOT holds the downloads host's landing page."

          # What is already up there. The root itself is a secret and is
          # masked in these logs, but its contents are not secret and are the
          # whole point: `connect` means Connect has published, `remote`
          # means this workflow has, and a run that shows neither is pointed
          # somewhere nothing has ever been uploaded.
          echo "Top level of the downloads root:"
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "ls -la '${REMOTE_ROOT}'" || true

          echo "What is published for ${PRODUCT} so far:"
          ssh -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "ls -la '${REMOTE_ROOT}/${PRODUCT}' 2>/dev/null || echo '  nothing yet'" || true

      # Into the version's own directory, so publishing 1.1.0 cannot disturb
      # 1.0.0 and a link that worked yesterday still works.
      #
      # No --delete. Every build has a name of its own, so nothing here is
      # ever overwritten -- and the manifest the website is reading right now
      # still names the previous build until the last step replaces it, so
      # deleting that build first would break every download button for as
      # long as this run takes. Older builds stay, which is also what lets
      # mode=manifest-only with a build roll back to one.
      - name: Upload the installers
        if: inputs.mode == 'files-and-manifest'
        env:
          SSH_HOST: ${{ secrets.DOWNLOAD_PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.DOWNLOAD_PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.DOWNLOAD_PROD_SSH_USER }}
          REMOTE_ROOT: ${{ secrets.DOWNLOAD_PROD_SSH_REMOTE_ROOT }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          DEST="${REMOTE_ROOT%/}/${PRODUCT}/${VERSION}"
          echo "Uploading to ${DEST}"
          rsync -avz --chmod=D755,F644 \
            --exclude='manifest.json' \
            --rsync-path="mkdir -p '${DEST}' && rsync" \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            staging/ \
            "${SSH_USER}@${SSH_HOST}:${DEST}/"

      # The check the website cannot do for itself, and the reason the
      # manifest has not been written yet. Every file it names is fetched from
      # the public URL a visitor would use, over verified HTTPS, and must
      # answer with the exact size claimed. A failure here leaves the files
      # where they are and the manifest unwritten, so the download page goes
      # on showing nothing rather than showing a broken button.
      - name: Verify every file is really there, over HTTPS
        if: inputs.mode != 'check-access'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          failed=0
          count=0

          while IFS=$'\t' read -r file size; do
            count=$((count + 1))
            url="${BASE_URL}/${PRODUCT}/${VERSION}/${file}"

            # --proto '=https' refuses anything that is not HTTPS, including a
            # redirect to it. No -k, ever: an unverified certificate here would
            # make the whole check meaningless.
            headers=$(curl -sSI --proto '=https' --max-time 60 --retry 3 --retry-delay 5 "${url}" 2>&1) || {
              echo "::error title=Not reachable::${url}"
              echo "${headers}" | head -5
              failed=1
              continue
            }

            code=$(printf '%s' "${headers}" | awk 'tolower($1) ~ /^http/ { print $2 }' | tail -1)
            length=$(printf '%s' "${headers}" | awk -F': *' 'tolower($1) == "content-length" { print $2 }' | tr -d '\r' | tail -1)

            if [ "${code}" != "200" ]; then
              echo "::error title=HTTP ${code}::${url}"
              failed=1
            elif [ -n "${length}" ] && [ "${length}" != "${size}" ]; then
              echo "::error title=Wrong size::${url} is ${length} bytes, the manifest says ${size}"
              failed=1
            else
              echo "ok  ${code}  ${size}  ${url}"
            fi
          done < <(jq -r '.files[] | [.file, (.size|tostring)] | @tsv' manifest.json)

          if [ "${count}" -eq 0 ]; then
            echo "::error::The manifest describes no files."
            exit 1
          fi

          if [ "${failed}" -ne 0 ]; then
            echo "::error title=The manifest was not published::Not every file the manifest names could be fetched over HTTPS, so it was not written. If this is a TLS error rather than a 404, the certificate for downloads.aicountly.com is not installed yet -- the files are uploaded and waiting, and re-running this with mode=manifest-only finishes the publish once it is. See the HTTPS section of aicountly/aicountly-downloads."
            exit 1
          fi

      # Last, and only now.
      - name: Publish the manifest
        if: inputs.mode != 'check-access'
        env:
          SSH_HOST: ${{ secrets.DOWNLOAD_PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.DOWNLOAD_PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.DOWNLOAD_PROD_SSH_USER }}
          REMOTE_ROOT: ${{ secrets.DOWNLOAD_PROD_SSH_REMOTE_ROOT }}
        run: |
          set -euo pipefail
          DEST="${REMOTE_ROOT%/}/${PRODUCT}"
          rsync -avz --chmod=F644 \
            --rsync-path="mkdir -p '${DEST}' && rsync" \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            manifest.json \
            "${SSH_USER}@${SSH_HOST}:${DEST}/manifest.json"

      # What the website will read, read the same way. `generated` rather than
      # `version`: two runs of the same version produce the same version and
      # different timestamps, so this is the one field that can tell "the
      # manifest I just wrote" from "a manifest that was already there".
      - name: Check the website will see this release
        if: inputs.mode != 'check-access'
        run: |
          set -euo pipefail
          url="${BASE_URL}/${PRODUCT}/manifest.json"

          curl -sS --proto '=https' --fail --max-time 30 --retry 3 --retry-delay 5 \
            -o manifest-live.json "${url}"

          node -e "
            const live = require('./manifest-live.json');
            const built = require('./manifest.json');
            if (live.generated !== built.generated) {
              console.error('the served manifest is not the one just uploaded:', live.generated, '!=', built.generated);
              process.exit(1);
            }
            console.log('served manifest matches this run,', live.files.length, 'file(s)');
            for (const f of live.files) {
              console.log(' ', f.platform, f.arch, (f.size / 1048576).toFixed(1) + 'MB', 'signed=' + f.signed, f.file);
            }
          "

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "${MODE}" = "check-access" ]; then
            {
              echo "## Downloads host access check"
              echo
              echo "Nothing was uploaded. If this run is green, all five"
              echo "\`DOWNLOAD_PROD_SSH_*\` secrets are set in this repository, the key"
              echo "opens that account, and \`DOWNLOAD_PROD_SSH_REMOTE_ROOT\` is the"
              echo "document root downloads.aicountly.com actually serves -- checked by"
              echo "finding the landing page that aicountly/aicountly-downloads deploys."
              echo
              echo "The step log above lists what is already on the host."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "## Remote ${VERSION} (${CHANNEL})"
            echo
            echo "- Mode: \`${MODE}\`"
            echo "- Build: ${BUILD:-newest of each platform}"
            echo "- Files: ${BASE_URL}/${PRODUCT}/${VERSION}/"
            echo "- Manifest: ${BASE_URL}/${PRODUCT}/manifest.json"
            echo
            if [ -f manifest.json ]; then
              echo '```json'
              cat manifest.json
              echo '```'
            fi
            echo
            echo "The download section on <https://aicountly.com/remote> reads that manifest."
            echo "It shows nothing until \`REMOTE_DESKTOP_RELEASED\` is true in aicountly/aicountly-com"
            echo "(includes/remote-downloads.php) -- publishing a build does not release it."
          } >> "${GITHUB_STEP_SUMMARY}"
