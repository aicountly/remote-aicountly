[package]
name = "aicountly-remote-desktop"
description = "AICOUNTLY Remote — the desktop agent's user-session process: tray, window, capture, input and the WebRTC session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The executable name a person sees in Task Manager and the installer registers.
name = "AicountlyRemote"
path = "src/main.rs"

[lib]
# Everything except `main.rs` is a library, so the parts that are not Tauri or
# Win32 can be tested on any host.
name = "aicountly_remote_desktop"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
time.workspace = true

remote-core.workspace = true
remote-protocol.workspace = true
remote-security.workspace = true
remote-device.workspace = true
remote-webrtc.workspace = true
aicountly-remote-service = { path = "../agents/windows-service" }

# `unstable` is Tauri's name for multiple webviews in one window, which is how
# the web portal is shown inside the application window (`src/portal.rs`).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# No `tauri-plugin-updater`. It was here, switched off (`active: false`, no
# endpoints, no public key) against the day updater keys and a release feed
# exist — and it was the only thing pulling in `zip`, which carries three
# advisories including a 9.1 critical (RUSTSEC-2026-0367/0368/0369, fixed in
# zip 9, which the plugin does not take yet). Carrying a critical advisory in
# a binary that runs as the signed-in person, for a feature that is turned
# off, is not a trade worth making. Re-adding the plugin is one line here,
# one in `lib.rs`, one in `capabilities/default.json` and the `plugins.updater`
# block in `tauri.conf.json` — see docs/desktop/WINDOWS_RELEASE.md.
tauri-plugin-single-instance = "2"
# Stop control from anywhere, without finding the window: one system-wide
# shortcut, registered by the Rust side only (the window cannot reach it).
tauri-plugin-global-shortcut = "~2.3"
# Opening a URL in the person's own browser. Used behind an allowlist — see
# `commands::is_permitted_url` — never as a passthrough.
open = "5"

[target.'cfg(windows)'.dependencies]
# Only the features the platform layer actually calls. Pulling all of `windows`
# adds minutes to every build and a great deal of surface nothing touches —
# and a missing feature is a compile error, which is how this list stays true.
windows = { version = "0.62", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security_Cryptography",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_UI_Input",
    "Win32_System_StationsAndDesktops",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS control companion (docs/desktop/CONTROL_COMPANION.md). The same versions Tauri's own macOS stack already
# resolves, so these add no second copy of anything:
#   * core-graphics — CGEvent injection from a private event source, and the display list (CGGetActiveDisplayList,
#     CGDisplayBounds), which needs no Screen Recording permission;
#   * core-foundation — the CFDictionary AXIsProcessTrustedWithOptions takes, and the CFString the computer name is;
#   * security-framework — the Keychain item the device key lives in;
#   * libc — sysctl, for the OS version and the hardware model.
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
security-framework = { version = "3.7", features = ["OSX_10_15"] }
libc = "0.2"

[dev-dependencies]
# `test-util` for the companion's tests, which run its loop on a paused clock.
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
remote-security = { workspace = true, features = ["test-support"] }
