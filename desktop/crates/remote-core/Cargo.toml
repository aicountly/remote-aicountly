[package]
name = "remote-core"
description = "The portable heart of the AICOUNTLY Remote desktop agent: configuration, the API client, the agent state machine and reconnection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `fs` for writing a downloaded update (`update`).
tokio = { workspace = true, features = ["fs"] }
reqwest.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
futures-util.workspace = true
time.workspace = true
sha2.workspace = true
hex.workspace = true
semver.workspace = true
remote-protocol.workspace = true
remote-security.workspace = true
remote-device.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
