# ---------------------------------------------------------------------------
# cargo-audit configuration for the AICOUNTLY Remote desktop workspace.
#
# `cargo audit --deny warnings` runs in CI, so a NEW advisory of any kind fails
# the build. That is only useful if the standing ones are listed here with a
# reason — an audit whose output nobody reads is an audit that is not running.
#
# The rule, and the one exception
# -------------------------------
# A vulnerability advisory does not belong on this list: the dependency gets
# upgraded, or removed. That has been held to — `zip`'s three advisories,
# including a 9.1 critical, were removed from this product by deleting the
# disabled `tauri-plugin-updater` that was the only thing pulling it in, and
# the TLS advisories of 2026-10 were cleared by upgrading. There is exactly
# one exception below (RUSTSEC-2026-0387), it is annotated as one, and it is
# here because no upgrade exists to take: it is reached through a transitive
# pin that this workspace does not choose.
#
# Everything else below is an `unmaintained` or `unsound` advisory on code
# that is **not in the shipped Windows binary** — the GTK3/webkit2gtk backend
# Tauri uses on Linux, its DBus backend, or a Unix-only API. Each was checked
# against `cargo tree --target x86_64-pc-windows-msvc` before it was added,
# and they are re-checked whenever Tauri is upgraded.
# ---------------------------------------------------------------------------
[advisories]
ignore = [
    # gtk-rs GTK3 bindings, unmaintained. Pulled in by tauri on Linux only;
    # the Windows build uses WebView2 and links none of them.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # Unsoundness in glib's VariantStrIter. Same story: glib is the GTK
    # backend's dependency and is not in the Windows binary.
    "RUSTSEC-2024-0429",
    # proc-macro-error, unmaintained. A build-time macro dependency; nothing
    # from it is in any shipped binary.
    "RUSTSEC-2024-0370",
    # The unic-* family, unmaintained. Reached through Tauri's URL/IDNA
    # handling on the Linux build path.
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",

    # ----------------------------------------------------------- 2026-10
    #
    # zbus and its two companions, unmaintained. Reached only through
    # `tauri-plugin-single-instance`, which talks DBus on Linux and uses a
    # named mutex on Windows: `cargo tree -i zbus --target
    # x86_64-pc-windows-msvc` finds nothing. Same category as the GTK entries
    # above.
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0372", # zvariant_derive

    # Unsoundness in `tokio::io::unix::AsyncFd`. A Unix-only module; it does
    # not exist on the Windows target, and nothing in this workspace calls it
    # on any target.
    "RUSTSEC-2026-0386",

    # THE EXCEPTION, and the only vulnerability on this list.
    #
    # crypto-bigint 0.5.5 — timing variability in operations meant to be
    # constant-time. Fixed in 0.7.6, which is two breaking releases away and
    # not ours to take: it arrives as
    #
    #     webrtc 0.20.5 -> rtc-dtls/rtc-shared -> p256/p384 0.13
    #                   -> elliptic-curve 0.13 -> crypto-bigint 0.5.5
    #
    # and moving to crypto-bigint 0.7 needs elliptic-curve 0.14, which needs
    # a webrtc release that takes it. `cargo update` cannot reach it.
    #
    # What it means here: the affected operations are in the DTLS key
    # exchange of a peer connection, and exploiting timing variability in
    # them needs a local attacker able to measure this process precisely —
    # on a machine where, by then, they can already see the screen. That is
    # the judgement, not an assertion that it does not matter.
    #
    # REVIEW ON EVERY WEBRTC UPGRADE, and remove this line the moment one
    # ships that takes elliptic-curve 0.14 or later.
    "RUSTSEC-2026-0387", # crypto-bigint
]
informational_warnings = ["unmaintained", "unsound", "notice"]
severity_threshold = "low"
